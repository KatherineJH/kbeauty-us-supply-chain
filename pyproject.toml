[project]
name = "kbeauty-us-supply-chain"
version = "1.0.0"
description = "K-뷰티 대미 수출 공급망 분석: 미국 Census 공개 수입 통계로 본 물량·단가·운송수단·하역항·리드타임"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbeauty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temporary files stay inside the repository (ignored by git), so runs do not depend on system temp permissions.
addopts = "--basetemp=.pytest_tmp"
markers = ["integration: builds the DuckDB warehouse from the committed raw data"]
